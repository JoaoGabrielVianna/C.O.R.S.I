<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8F8F9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1012" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="C.O.R.S.I — A personal AI ecosystem. Modules I build for myself to organize different areas of my life. Built in public by João Corsi."
    />
    <meta property="og:title" content="C.O.R.S.I — personal AI ecosystem" />
    <meta
      property="og:description"
      content="An ecosystem of AI modules I build for myself, in public."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>C.O.R.S.I — personal AI ecosystem</title>
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("corsi.theme");
          var theme = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var resolved = theme === "system"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : theme;
          if (resolved === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (_) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
