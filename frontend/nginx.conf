server {
  listen      3000 default_server;
  server_name _;

  root  /usr/share/nginx/html;
  index index.html;

  # Gzip text assets. Vite already hashes filenames so cache headers are safe.
  gzip            on;
  gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed static assets — cache forever.
  location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
    expires    1y;
    add_header Cache-Control "public, immutable";
    try_files  $uri =404;
  }

  # SPA fallback — every unknown path returns index.html so React Router
  # can resolve the route client-side.
  location / {
    try_files $uri /index.html;
  }

  # Container healthcheck.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return     200 'ok';
  }
}
