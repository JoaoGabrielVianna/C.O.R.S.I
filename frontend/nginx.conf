# ══════════════════════════════════════════════════════════════════════
#
#   THE ONLY PUBLIC ENTRY POINT INTO C.O.R.S.I.
#
# ══════════════════════════════════════════════════════════════════════
#
# One hostname reaches this server. The API has no hostname, no Traefik
# router and no published port: the only way to it from outside is `/api/`
# below, and everything that arrives there meets the backend's
# authentication gate, which denies by default.
#
# ── What this replaced, and why ────────────────────────────────────────
# Access used to be a Traefik file-provider override with two hostnames and
# a rule that sent `/finance`, `/chat`, `/job-radar`, `/releases`… straight
# to the API. Two things were wrong with it. The API answered on a public
# address with `X-Workspace-Id` — a header the middleware accepts as any
# valid UUID and the frontend sends as a public constant — as the only thing
# in front of the data. And the rule ENUMERATED module prefixes, so it had
# already fallen behind by two modules: `/palace` and `/threads` were not in
# it. One `/api/` prefix has no list to fall behind.

upstream corsi_api {
  # Swarm's internal DNS. Resolved at worker start; the service name is
  # stable across deploys even as task ids change.
  server clients_corsi-api:8080;
  keepalive 16;
}

server {
  listen      3000 default_server;
  server_name _;

  root  /usr/share/nginx/html;
  index index.html;

  # Gzip text assets. Vite already hashes filenames so cache headers are safe.
  gzip            on;
  gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # The SPA is served over HTTPS at the edge and must not be framed or
  # sniffed. Set here rather than in the app because a static file server is
  # where the response actually leaves.
  add_header X-Content-Type-Options nosniff       always;
  add_header X-Frame-Options        DENY          always;
  add_header Referrer-Policy        same-origin   always;

  # ── The API, same-origin ─────────────────────────────────────────────
  #
  # `/api/` is stripped on the way through, so the browser asks for
  # `/api/finance/summary` and the backend sees `/finance/summary`. The
  # frontend bundle is built with VITE_API_URL=/api to match.
  #
  # Same-origin is not a convenience here, it is what makes the session
  # cookie work without SameSite=None: one origin means no cross-site
  # request, which means the CSRF property of SameSite=Lax holds.
  location /api/ {
    proxy_pass         http://corsi_api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";

    # Agents answers over Server-Sent Events, and a buffering proxy turns a
    # token-by-token stream into one silent wait followed by a wall of text.
    proxy_buffering    off;
    proxy_cache        off;
    # A model can think for longer than the default 60s. The backend has
    # its own bounds on a turn; this must not be the thing that cuts one.
    proxy_read_timeout 10m;
    proxy_send_timeout 10m;
  }

  # ── Addresses that exist on the API and must NOT be reachable ────────
  #
  # `/metrics` is unauthenticated on the backend by an existing, documented
  # decision — a Prometheus scrape carries no credential. That decision is
  # safe precisely because the path is not published, and this block is what
  # makes that true. `/swagger` and `/openapi.yaml` are developer surfaces
  # with no reason to exist on a public hostname.
  location ~ ^/api/(metrics|swagger|openapi\.yaml) {
    return 404;
  }

  # ── Hashed static assets ─────────────────────────────────────────────
  #
  # A regex location, so it is matched before the `/app` prefix below and
  # never pays for an auth subrequest. These files carry no data: they are
  # the same bytes for an anonymous visitor and for the operator, and the
  # bundle contains no secret — the session is a cookie the JavaScript
  # cannot read.
  location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
    expires    1y;
    add_header Cache-Control "public, immutable";
    try_files  $uri =404;
  }

  # ── The authenticated shell ──────────────────────────────────────────
  #
  # `/app/*` is HTML, and HTML is where a person lands. The subrequest asks
  # the backend whether this browser has a session and redirects to /login
  # when it does not.
  #
  # ── This is defence in depth and NOT the gate ────────────────────────
  # The gate is in the API, which refuses every request without a session on
  # its own and would keep doing so if this block were deleted. What this
  # adds is that an anonymous request for the app is refused at the edge
  # instead of being answered with a shell that redirects itself — the
  # difference between the product saying no and the product's JavaScript
  # saying no. `docs/platform/capabilities.md` is explicit that proxy
  # authentication is never the solution, and this is not standing in for
  # one.
  #
  # The cost is stated plainly: one subrequest per navigation, and a backend
  # that is down makes the shell unavailable rather than merely empty. The
  # app cannot do anything without the API anyway.
  location /app {
    auth_request /_session;
    error_page 401 403 = @login_redirect;
    try_files $uri /index.html;
  }

  location = /_session {
    internal;
    proxy_pass              http://corsi_api/auth/session;
    proxy_http_version      1.1;
    # A subrequest that forwarded the body would read it out from under the
    # real request. Only the cookie matters here.
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
    proxy_set_header        Host           $host;
    proxy_set_header        X-Real-IP      $remote_addr;
    proxy_set_header        Connection     "";
  }

  location @login_redirect {
    # 302 rather than 401, because the caller is a browser following a link
    # and the useful answer is the login screen. The API still answers 401
    # to the API's own callers, which is what a client can branch on.
    return 302 /login;
  }

  # ── Everything else ──────────────────────────────────────────────────
  #
  # `/` is the public landing page and `/login` is the form, both by
  # decision: neither renders operator data, and the login screen obviously
  # cannot sit behind the login. The SPA fallback serves index.html so React
  # Router can resolve the route client-side.
  location / {
    try_files $uri /index.html;
  }

  # Container healthcheck. Served by nginx itself so it reports THIS
  # container's health and not the backend's.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return     200 'ok';
  }
}
