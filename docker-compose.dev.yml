# Local development dependencies only. The backend itself runs natively
# via `make dev` (go run) so reloads stay instant. Production runs the
# backend container directly on EasyPanel — see docs/DEPLOY-EASYPANEL.md.
name: corsi-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: corsi
      POSTGRES_PASSWORD: corsi
      POSTGRES_DB: corsi
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corsi -d corsi"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Opt-in tracing UI. Enable with: docker compose --profile observability up -d
  jaeger:
    image: jaegertracing/all-in-one:1.62
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # ui
      - "4317:4317"     # otlp grpc

volumes:
  postgres_data:
